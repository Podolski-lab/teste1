AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Assistente Pessoal - backend da Alexa Skill (Story 1.1: Lambda do skill
  handler, sem persistência; Story 1.2: tabela PillarConfig, escrita só
  pelo CLI local scripts/associar-pilar.ts).

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 8
    MemorySize: 128
    Tracing: Active

Resources:
  # Lambda que atende as requisições do ASK SDK (LaunchRequest, SessionEndedRequest,
  # erros). Nomeado explicitamente para que o Lambda do Poller (Story 1.3) possa
  # ser adicionado depois neste mesmo template sem exigir renomear este recurso.
  SkillHandlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'node24'
        EntryPoints:
          - src/handlers/skill.ts
    Properties:
      FunctionName: assistente-pessoal-skill-handler
      Handler: skill.handler
      CodeUri: .
      Description: >-
        Entrypoint ASK SDK da Skill "assistente pessoal" - responde
        LaunchRequest/SessionEndedRequest/erros (Story 1.1, sem persistência).
      # AWSLambdaBasicExecutionRole é a policy gerenciada padrão da AWS (escrita
      # em CloudWatch Logs em geral, não restrita ao log group desta função) -
      # nenhuma permissão de DynamoDB é concedida nesta story (AC explícita da
      # spec 1.1).
      Policies:
        - AWSLambdaBasicExecutionRole

  SkillHandlerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SkillHandlerFunction}
      RetentionInDays: 14

  # Mapeamento evento de calendario -> pilar/proposito (FR-11), usado pelo Poller
  # (Story 1.3) para resolver o pilar/proposito de uma tarefa. Escrita apenas pelo
  # CLI local scripts/associar-pilar.ts (AD-5) - nenhum Lambda le ou escreve esta
  # tabela nesta story. Nome fixo para o script referenciar sem ler outputs do
  # CloudFormation.
  PillarConfigTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: PillarConfig
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: calendar_event_pattern
          AttributeType: S
      KeySchema:
        - AttributeName: calendar_event_pattern
          KeyType: HASH

Outputs:
  SkillHandlerFunctionArn:
    Description: >-
      ARN do Lambda a configurar como endpoint da Skill no Alexa Developer
      Console (Endpoint > AWS Lambda ARN).
    Value: !GetAtt SkillHandlerFunction.Arn
